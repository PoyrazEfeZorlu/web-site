<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödevler - Kişisel Web Sitem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #2c3e50; color: #fff; padding: 1rem 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #4ca1af; }
        .nav-links { list-style: none; display: flex; }
        .nav-links li { margin-left: 20px; }
        .nav-links a { color: #fff; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #4ca1af; }
        main { flex: 1; padding: 60px 20px; max-width: 1100px; margin: 0 auto; width: 100%; }
        .section-title { text-align: center; font-size: 2rem; margin-bottom: 30px; color: #2c3e50; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { margin-bottom: 10px; color: #2c3e50; }
        .card p { color: #666; font-size: 0.95rem; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; margin-top: 15px; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        footer { text-align: center; padding: 20px; background-color: #2c3e50; color: #fff; }
        @media (max-width: 768px) {
            nav { flex-direction: column; }
            .nav-links { margin-top: 15px; }
            .nav-links li { margin: 0 10px; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">PoyrazEfeZorlu</div>
            <ul class="nav-links">
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="dersler.html">Dersler</a></li>
                <li><a href="odevler.html" class="active">Ödevler</a></li>
                <li><a href="portfolyo.html">Portfolyo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Ödevler</h2>
        <div class="grid-container">
            <div class="card">
                <h3>Ödev 1: HTML/CSS Tasarımı</h3>
                <p>Kişisel ders ve portfolo içeren site.</p>
                <span class="badge badge-success">Tamamlandı</span>
            </div>
            <div class="card">
                <h3>Ödev 2: Arduino uno ile isim yazma </h3>
                <p>Arduino uno kullanarak ledlerle isim yazma.</p>
                <span class="badge badge-warning">Devam Ediyor</span>
            </div>
        </div>
    </main>

    <footer>
       
    </footer>
</body>
</html>
